services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ainovel
      MYSQL_DATABASE: ainovel
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-painovel"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine

  api:
    build: .
    environment:
      AINOVEL_HOST: 0.0.0.0
      AINOVEL_PORT: "8765"
      AINOVEL_CORS_ORIGINS: http://127.0.0.1:8080
      AINOVEL_MYSQL_HOST: mysql
      AINOVEL_MYSQL_PORT: "3306"
      AINOVEL_MYSQL_USER: root
      AINOVEL_MYSQL_PASSWORD: ainovel
      AINOVEL_MYSQL_DATABASE: ainovel
      AINOVEL_REDIS_URL: redis://redis:6379/0
    volumes:
      - ainovel-home:/root/.ainovel
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE: http://127.0.0.1:8080
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mysql-data:
  ainovel-home:
